<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أراكم">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>تسجيل الدخول</title>
</head>
<body>
<div class="login-wrap">
  <form class="card login" id="f">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h3M6 14h3M13 10v4M16 10v4"/></svg></div>
    <h1>نظام التعرف على اللوحات</h1>
    <p class="muted">سجّل الدخول لإدارة بواباتك</p>
    <label for="u">اسم المستخدم</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" dir="ltr" required>
    <label for="p">كلمة المرور</label>
    <input id="p" name="password" type="password" autocomplete="current-password" dir="ltr" required>
    <button class="btn primary" type="submit">دخول</button>
    <div class="install-hint muted" id="hint"></div>
  </form>
</div>
<script src="/js/common.js"></script>
<script>
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await act(() => api('/api/login', { body: formData(e.target) }));
  if (r) location.href = r.role === 'admin' ? '/admin' : '/app';
});
// تلميح تثبيت التطبيق على الجوال
let deferred;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferred = e;
  $('#hint').innerHTML = '<button type="button" class="btn sm" id="inst">ثبّت التطبيق على جوالك</button>';
  $('#inst').onclick = () => deferred.prompt();
});
if (/iphone|ipad/i.test(navigator.userAgent) && !navigator.standalone) {
  $('#hint').textContent = 'لتثبيت التطبيق على الآيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»';
}
</script>
</body>
</html>
