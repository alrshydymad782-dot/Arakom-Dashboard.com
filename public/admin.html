<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أراكم - إدارة">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>لوحة الإدارة</title>
</head>
<body>
<nav class="tabbar"></nav>
<main class="app">
  <header class="topbar">
    <div class="avatar">م</div>
    <div class="grow">
      <h1 id="page-title">نظرة عامة</h1>
      <div class="sub"><span class="live-dot"></span> لوحة إدارة النظام</div>
    </div>
    <button class="icon-btn" onclick="toggleTheme()" title="الوضع الداكن">◐</button>
    <button class="icon-btn" onclick="logout()" title="خروج" id="lo"></button>
  </header>

  <section data-view="overview">
    <div class="grid stats" id="stats"></div>
    <div id="alerts"></div>
    <div class="section-title"><h2>آخر القراءات (كل العملاء)</h2></div>
    <div class="card"><div class="list" id="feed"></div></div>
    <div class="section-title"><h2>حركة اليوم حسب الساعة</h2></div>
    <div class="card" id="hours"></div>
  </section>

  <section data-view="customers" class="hidden">
    <div class="row"><input id="cq" class="grow" placeholder="بحث عن عميل"><button class="btn primary" id="add-customer"></button></div>
    <div class="card" style="margin-top:12px"><div class="list" id="customers"></div></div>
  </section>

  <section data-view="devices" class="hidden">
    <div class="row">
      <div class="chips grow" id="dev-chips"><button data-f="" class="active">الكل</button><button data-f="unassigned">غير مرتبطة</button><button data-f="offline">غير متصلة</button></div>
      <button class="btn primary" id="add-device"></button>
    </div>
    <div class="card" style="margin-top:12px"><div class="list" id="devlist"></div></div>
  </section>

  <section data-view="reads" class="hidden">
    <form class="card filters" id="hf">
      <input name="q" class="full" placeholder="رقم اللوحة">
      <select name="customer_id" id="hf-cust"><option value="">كل العملاء</option></select>
      <select name="status"><option value="">كل الحالات</option><option value="allow">مسموح</option><option value="block">محظور</option><option value="unknown">غير مسجل</option></select>
      <input name="from" type="date">
      <input name="to" type="date">
      <div class="row full"><button class="btn primary grow">بحث</button><a class="btn" id="csv">تصدير</a></div>
    </form>
    <div class="section-title"><h2 id="h-count"></h2></div>
    <div class="card"><div class="list" id="hlist"></div></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn hidden" id="more">تحميل المزيد</button></div>
  </section>

  <section data-view="users" class="hidden">
    <div class="row"><div class="grow"></div><button class="btn primary" id="add-user"></button></div>
    <div class="card" style="margin-top:12px"><div class="list" id="users"></div></div>
  </section>

  <section data-view="system" class="hidden">
    <div class="section-title"><h2>حالة خادم MQTT</h2></div>
    <div class="card list" id="sys"></div>
    <div class="section-title"><h2>سجل العمليات</h2></div>
    <div class="card table-wrap"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>العميل</th><th>تفاصيل</th></tr></thead><tbody id="audit"></tbody></table></div>
  </section>
</main>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
