<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أراكم">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>بواباتي</title>
</head>
<body>
<nav class="tabbar"></nav>
<main class="app">
  <header class="topbar">
    <div class="avatar" id="avatar">أ</div>
    <div class="grow">
      <h1 id="page-title">الرئيسية</h1>
      <div class="sub"><span class="live-dot"></span> <span id="who"></span></div>
    </div>
    <button class="icon-btn" id="notif-btn" title="تفعيل الإشعارات"></button>
  </header>

  <!-- الرئيسية -->
  <section data-view="home">
    <div class="grid stats" id="stats"></div>
    <div class="section-title"><h2>أجهزتي</h2></div>
    <div class="grid devices" id="devices"></div>
    <div class="section-title"><h2>آخر المركبات</h2><a href="#history" data-go="history" class="small">عرض الكل</a></div>
    <div class="card"><div class="list" id="feed"></div></div>
    <div class="section-title"><h2>حركة اليوم حسب الساعة</h2></div>
    <div class="card" id="hours"></div>
  </section>

  <!-- السجل -->
  <section data-view="history" class="hidden">
    <form class="card filters" id="hf">
      <input name="q" class="full" placeholder="ابحث برقم اللوحة (عربي أو إنجليزي)">
      <select name="device_id" id="hf-dev"><option value="">كل الأجهزة</option></select>
      <select name="status">
        <option value="">كل الحالات</option><option value="allow">مسموح</option><option value="block">محظور</option><option value="unknown">غير مسجل</option><option value="expired">منتهي</option>
      </select>
      <input name="from" type="date" title="من">
      <input name="to" type="date" title="إلى">
      <div class="row full"><button class="btn primary grow" type="submit">بحث</button><a class="btn" id="csv">تصدير</a></div>
    </form>
    <div class="section-title"><h2 id="h-count"></h2></div>
    <div class="card"><div class="list" id="hlist"></div></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn hidden" id="more">تحميل المزيد</button></div>
  </section>

  <!-- اللوحات -->
  <section data-view="lists" class="hidden">
    <div class="row">
      <div class="chips grow" id="kind-chips">
        <button data-kind="" class="active">الكل</button><button data-kind="allow">المسموح لهم</button><button data-kind="block">المحظورون</button>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <input id="lq" class="grow" placeholder="بحث باللوحة أو الاسم">
      <button class="btn primary" id="add-plate"></button>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn sm" id="import">استيراد قائمة</button></div>
    <div class="card" style="margin-top:12px"><div class="list" id="plates"></div></div>
  </section>

  <!-- الإعدادات -->
  <section data-view="settings" class="hidden">
    <div class="section-title"><h2>إعدادات الأجهزة</h2></div>
    <div class="card"><div class="list" id="dev-settings"></div></div>
    <div class="section-title"><h2>الحساب</h2></div>
    <div class="card list">
      <div class="item"><div class="info"><div class="t">تغيير كلمة المرور</div></div><button class="btn sm" id="chpw">تغيير</button></div>
      <div class="item"><div class="info"><div class="t">الوضع الداكن / الفاتح</div></div><button class="btn sm" onclick="toggleTheme()">تبديل</button></div>
      <div class="item"><div class="info"><div class="t">تسجيل الخروج</div></div><button class="btn sm danger" onclick="logout()">خروج</button></div>
    </div>
  </section>
</main>
<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
