# Mosquitto للإنتاج: لا اتصال بدون اسم مستخدم وكلمة مرور
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# لتشفير اتصال الكاميرات (إن كانت تدعم TLS) أضف شهادة واستخدم المنفذ 8883:
# listener 8883
# certfile /mosquitto/config/certs/fullchain.pem
# keyfile  /mosquitto/config/certs/privkey.pem
